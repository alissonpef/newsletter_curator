[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "newsletter-curator"
version = "0.1.0"
description = "Local-first newsletter curation pipeline with RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.5",
  "jinja2>=3.1.4",
  "piper-tts>=1.4.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "tenacity>=8.5.0",
  "typer>=0.12.3",
  "weasyprint>=62.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[project.scripts]
newsletter-curator = "hermes.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
